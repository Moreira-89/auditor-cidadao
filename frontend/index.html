<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Cidadão — Fiscalize gastos públicos com IA</title>
    <meta name="description" content="Auditor Cidadão recebe editais de licitação em PDF e usa um agente de IA para detectar irregularidades — de sobrepreço a empresas sancionadas.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <script>
        // Marca o <html> quando a coreografia do hero vai rodar — o CSS usa essa
        // classe para esconder o laudo até runHeroAnimation() assumir, evitando um
        // flash do estado final antes da animação. Com prefers-reduced-motion (ou
        // sem JS), a classe não existe e o HTML já mostra o laudo pronto, estático.
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('hero-anim');
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/home/main.jsx"></script>
</body>
</html>
