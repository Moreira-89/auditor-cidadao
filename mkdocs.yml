site_name: Auditor Cidadão - Documentação Técnica
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono
  # Sem toggle claro/escuro: o frontend do Auditor Cidadão também é
  # "canvas escuro único, sem modo claro" (ver frontend/css/style.css) —
  # a documentação segue a mesma identidade visual.
  palette:
    - scheme: slate
      primary: black
      accent: teal

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - print-site:
      # Gera /print_page/ combinando todo o nav, na ordem em que aparece abaixo,
      # em um único documento — abrir essa página e "Salvar como PDF" no navegador
      # entrega a documentação inteira num arquivo só, sem merge manual.
      add_to_navigation: true
      print_page_title: 'Auditor Cidadão — Documentação Completa'
      # Mermaid é renderizado via JS antes da página carregar — funciona
      # normalmente na /print_page/ porque o navegador executa o JS ao abrir.
      add_table_of_contents: true
      toc_title: 'Sumário'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Operacional:
      - Visão geral: operacional/index.md
      - Setup local: operacional/setup_local.md
      - Docker & Deploy: operacional/docker.md
      - Variáveis de ambiente: operacional/variaveis_ambiente.md
  - Arquitetura:
      - Visão geral: arquitetura/visao_geral.md
      - Fluxo de dados: arquitetura/fluxo_dados.md
      - Protocolo MCP: arquitetura/protocolo_mcp.md
  - Engenharia de IA:
      - Modelos e prompts: ia/modelos_prompts.md
      - Extração de laudo: ia/extracao_laudo.md
      - Avaliação (RAGAS): ia/avaliacao.md
      - Catálogo de anomalias: ia/anomalias.md
  - Governança:
      - LGPD e privacidade: governanca/lgpd.md
      - Guardrails: governanca/guardrails.md
      - Limitações conhecidas: governanca/limitacoes.md