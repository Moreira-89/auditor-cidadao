<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Cidadão</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="chat-container">
    <h1>🕵️‍♂️ Auditor Cidadão</h1>
    <p style="text-align: center; color: gray;">Base de Dados: Prefeitura de Suzano</p>
    
    <div class="chat-box" id="chat-box">
        <div class="mensagem-ia"><strong>Auditor:</strong> Olá! Faça uma pergunta sobre a licitação.</div>
    </div>
    
    <p class="loading" id="loading-text">Analisando documentos governamentais...</p>
    
    <div class="input-group">
        <input type="text" id="pergunta-input" placeholder="Ex: Qual o valor total do contrato?">
        <button onclick="enviarPergunta()">Investigar</button>
    </div>
    <div style="background-color: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        <label for="pdf-upload" style="font-weight: bold; cursor: pointer; color: #007bff;">📄 Anexar novo Edital (PDF)</label>
        <input type="file" id="pdf-upload" accept=".pdf" style="display: none;" onchange="enviarPDF()">
        <p id="upload-status" style="font-size: 12px; color: gray; margin-top: 5px;">Nenhum arquivo processado nesta sessão.</p>
    </div>
</div>

<script src="/static/js/script.js"></script>
</body>
</html>
